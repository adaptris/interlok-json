name: Gradle Check

on:
  push:
    branches-ignore:
    - develop

permissions: read-all

jobs:
  gradle-check:
    name: Gradle Check
    needs: debug-nvd
    uses: interlok-tooling/reusable-workflows/.github/workflows/gradle-check.yml@main
    secrets:
      NEXUS_REPO_PASSWORD: ${{ secrets.NEXUS_REPO_PASSWORD }}
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  debug-nvd:
    name: Debug NVD_API_KEY presence
    runs-on: ubuntu-latest
    steps:
      - name: Check NVD_API_KEY presence
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "NVD_API_KEY is empty or not set"
            exit 1
          fi
          echo "NVD_API_KEY is set"
          echo "Length: $(echo -n "$NVD_API_KEY" | wc -c)"
